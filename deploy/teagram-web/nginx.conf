worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format classonly 'route_class=web status=$status';
  access_log /dev/stdout classonly;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

  server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;

    # Bootstrap narrows connect-src to the chosen server after discovery.
    include /etc/nginx/security-headers.conf;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location ^~ /.well-known/ {
      try_files $uri =404;
    }

    location = /turnstile.html {
      include /etc/nginx/security-headers.conf;
      add_header Cross-Origin-Opener-Policy same-origin always;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
