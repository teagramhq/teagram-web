name: Deployment Stack Checks

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Immutable source commit to check out for a caller.
        required: false
        type: string
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  private-artifact:
    name: Build reviewed deployment artifact
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify the reviewed private artifact
        run: pnpm run build:deployment-artifact

      - name: Stage the verified artifact for image checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-deployment-${{ inputs.checkout_ref || github.sha }}
          path: dist-private
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  docker:
    name: docker
    needs: private-artifact
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PRIVATE_ARTIFACT_COMMIT: ${{ inputs.checkout_ref || github.sha }}

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Download the verified private artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: private-deployment-${{ inputs.checkout_ref || github.sha }}
          path: dist-private

      - name: Build deployment image
        run: docker build --pull --build-arg PRIVATE_ARTIFACT_COMMIT="$PRIVATE_ARTIFACT_COMMIT" --file deploy/telegram-web/Dockerfile --tag telegram-web:ci .

      - name: Start image and verify served stack
        shell: bash
        run: |
          set -euo pipefail

          container_name=telegram-web-ci
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            telegram-web:ci
          if docker exec "$container_name" node --version >/dev/null 2>&1; then
            echo "the serving image contains a Node.js runtime"
            exit 1
          fi
          if ! docker exec "$container_name" nginx -t; then
            docker logs "$container_name"
            exit 1
          fi
          nginx_config="$(docker exec "$container_name" nginx -T 2>&1)"
          grep --extended-regexp --quiet '^[[:space:]]*error_log /dev/stderr crit;$' <<<"$nginx_config"
          grep --fixed-strings --quiet "log_format classonly 'route_class=web status=\$status';" <<<"$nginx_config"
          grep --extended-regexp --quiet '^[[:space:]]*access_log /dev/stdout classonly;$' <<<"$nginx_config"

          ready=0
          for attempt in {1..30}; do
            if docker exec "$container_name" wget --quiet --output-document=/dev/null http://127.0.0.1:8080/healthz; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$container_name"
            exit 1
          fi

          test "$(docker exec "$container_name" wget --quiet --output-document=- http://127.0.0.1:8080/healthz)" = "ok"

          document="$(docker exec "$container_name" wget --quiet --output-document=- http://127.0.0.1:8080/)"
          fallback="$(docker exec "$container_name" wget --quiet --output-document=- http://127.0.0.1:8080/ci-fallback-test-route)"
          test "$document" = "$fallback"
          grep --fixed-strings --quiet '<!DOCTYPE html>' <<<"$document"

          document_headers="$(docker exec "$container_name" wget --quiet --server-response --output-document=/dev/null http://127.0.0.1:8080/ 2>&1)"
          grep --fixed-strings --quiet 'Content-Security-Policy:' <<<"$document_headers"
          grep --fixed-strings --quiet "connect-src 'self'" <<<"$document_headers"

          marker=invite-capability-log-check-only
          docker exec "$container_name" wget --quiet --output-document=/dev/null \
            --header "Referer: https://example.invalid/$marker" \
            "http://127.0.0.1:8080/+${marker}?probe=${marker}"
          web_logs="$(docker logs "$container_name" 2>&1)"
          if grep --fixed-strings --quiet "$marker" <<<"$web_logs"; then
            echo "synthetic invite marker found in Web logs"
            exit 1
          fi
          grep --fixed-strings --line-regexp --quiet 'route_class=web status=200' <<<"$web_logs"

          worker_paths="$(find dist-private -maxdepth 1 -type f -name 'index.worker-*.js' -printf '%f\n' | sort)"
          test -n "$worker_paths"
          while IFS= read -r worker_path; do
            docker exec "$container_name" wget --quiet --output-document=/dev/null "http://127.0.0.1:8080/$worker_path"
            worker_headers="$(docker exec "$container_name" wget --quiet --server-response --output-document=/dev/null "http://127.0.0.1:8080/$worker_path" 2>&1)"
            grep --fixed-strings --quiet 'Content-Type: application/javascript' <<<"$worker_headers"
            grep --fixed-strings --quiet 'Content-Security-Policy:' <<<"$worker_headers"
            grep --fixed-strings --quiet "connect-src 'self'" <<<"$worker_headers"
          done <<<"$worker_paths"

  compose:
    name: compose
    needs: private-artifact
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      PRIVATE_ARTIFACT_COMMIT: ${{ inputs.checkout_ref || github.sha }}

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Download the verified private artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: private-deployment-${{ inputs.checkout_ref || github.sha }}
          path: dist-private

      - name: Validate Compose project isolation and startup
        shell: bash
        run: |
          set -euo pipefail
          edge_config="$(docker compose -f deploy/telegram-web/compose.yaml config --format json)"
          root_config="$(docker compose -f docker-compose.yaml config --format json)"

          jq -e '
            .name == "telegram-web-edge" and
            (.services.web | has("mem_limit") | not) and
            (.services.web | has("cpus") | not) and
            (.services.web | has("pids_limit") | not) and
            .services.web.read_only == true and
            (.services.web.security_opt | index("no-new-privileges:true")) and
            (.services.web.ports | length == 1) and
            .services.web.ports[0].host_ip == "127.0.0.1" and
            .services.web.ports[0].target == 8080 and
            .services.web.ports[0].published == "8080" and
            .networks.web.name == "telegram-web-edge-net" and
            (.networks.web.internal // false) == false and
            .volumes.nginx_cache.name == "telegram-web-edge-nginx-cache"
          ' <<<"$edge_config"
          jq -e '
            .name == "telegram-web" and
            .networks.default.name == "telegram-web_default"
          ' <<<"$root_config"

          compose_files=(
            --project-name telegram-web-edge-ci
            --file deploy/telegram-web/compose.yaml
          )
          override_file="$(mktemp)"
          cat >"$override_file" <<'EOF'
          services:
            web:
              ports: !override
                - "127.0.0.1:18080:8080"
          EOF
          compose_files+=(--file "$override_file")

          cleanup() {
            docker compose "${compose_files[@]}" down --remove-orphans >/dev/null 2>&1 || true
            rm -f "$override_file"
          }
          trap cleanup EXIT

          runtime_config="$(docker compose "${compose_files[@]}" config --format json)"
          jq -e '
            .name == "telegram-web-edge-ci" and
            (.services.web.ports | length == 1) and
            .services.web.ports[0].host_ip == "127.0.0.1" and
            .services.web.ports[0].target == 8080 and
            .services.web.ports[0].published == "18080"
          ' <<<"$runtime_config"

          docker compose "${compose_files[@]}" up --build --detach

          container_id=""
          ready=0
          for attempt in {1..30}; do
            container_id="$(docker compose "${compose_files[@]}" ps --quiet web)"
            if [ -n "$container_id" ] && [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker compose "${compose_files[@]}" ps
            docker compose "${compose_files[@]}" logs
            exit 1
          fi

          effective_port="$(docker port "$container_id" 8080/tcp)"
          test "$effective_port" = "127.0.0.1:18080"

          host_health=""
          host_ready=0
          for attempt in {1..30}; do
            if host_health="$(curl --fail --silent http://127.0.0.1:18080/healthz)" && [ "$host_health" = "ok" ]; then
              host_ready=1
              break
            fi
            sleep 1
          done
          if [ "$host_ready" -ne 1 ]; then
            docker compose "${compose_files[@]}" ps
            docker compose "${compose_files[@]}" logs
            exit 1
          fi
          test "$host_health" = "ok"
