name: Private MTProto Artifact Publication

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_run:
    workflows:
      - Private MTProto Artifact Request
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

jobs:
  check-private-artifact:
    name: 'check: private-artifact'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read and validate the reviewed target
        id: target
        run: node scripts/private-artifact-release.mjs write-target-outputs

      - name: Validate the reviewed target in private mode
        env:
          MTPROTO_TARGET_MODE: ${{ steps.target.outputs.mode }}
          MTPROTO_PRIVATE_ENDPOINT: ${{ steps.target.outputs.endpoint }}
          MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE: ${{ steps.target.outputs.key_file }}
        run: node scripts/private-artifact-release.mjs validate-target

      - name: Run private negative-input, route, and attestation tests
        run: >-
          pnpm exec vitest run
          scripts/mtproto-target.test.mjs
          scripts/mtproto-worker-routing.test.mjs
          scripts/private-artifact-release.test.mjs
          src/tests/mtprotoRouting.test.ts
          src/tests/privateMtprotoEgress.test.ts
          src/tests/mtprotoWorkerReady.test.ts
          src/tests/superMessagePort.test.ts

      - name: Test private username auth log redaction
        env:
          MTPROTO_TARGET_MODE: ${{ steps.target.outputs.mode }}
          MTPROTO_PRIVATE_ENDPOINT: ${{ steps.target.outputs.endpoint }}
          MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE: ${{ steps.target.outputs.key_file }}
        run: pnpm exec vitest run src/tests/api/apiManagerAuthLogging.test.ts

      - name: Build the reviewed private artifact
        env:
          MTPROTO_TARGET_MODE: ${{ steps.target.outputs.mode }}
          MTPROTO_PRIVATE_ENDPOINT: ${{ steps.target.outputs.endpoint }}
          MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE: ${{ steps.target.outputs.key_file }}
        run: pnpm exec vite build --outDir dist-private

      - name: Audit private bundle routes, keys, and digest
        env:
          MTPROTO_TARGET_MODE: ${{ steps.target.outputs.mode }}
          MTPROTO_PRIVATE_ENDPOINT: ${{ steps.target.outputs.endpoint }}
          MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE: ${{ steps.target.outputs.key_file }}
        run: pnpm run check-bundle -- dist-private

      - name: Audit runtime public assets
        run: pnpm run check:private-artifact-assets -- dist-private

      - name: Verify private manifest, CSP, digest, and PR head
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {loadReviewedPrivateTarget} from './scripts/private-artifact-release.mjs';
          import {verifyPrivateArtifactCsp, verifyPrivateArtifactManifest} from './scripts/private-artifact.mjs';

          const {target} = loadReviewedPrivateTarget();
          const manifest = verifyPrivateArtifactManifest('dist-private', target);
          verifyPrivateArtifactCsp('dist-private', target.endpoint);
          const head = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          if(manifest.sourceCommit !== head) {
            throw new Error('[MT] private artifact manifest source commit does not match PR head');
          }
          console.log(`[private-artifact] sourceCommit=${head}`);
          console.log(`[private-artifact] artifactDigest=${manifest.artifactDigest}`);
          console.log(`[private-artifact] keyFingerprint=${target.fingerprint}`);
          NODE

      - name: Build and publisher-verify the reviewed web image
        env:
          IMAGE_REF: teagram-web:private-artifact-check
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/test-private-artifact-image.sh

  check-publication-request:
    name: 'check: publication-request'
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    outputs:
      publish_private_artifact: ${{ steps.prepare.outputs.publish_private_artifact }}
      source_ref: ${{ steps.prepare.outputs.source_ref }}
      source_commit: ${{ steps.prepare.outputs.source_commit }}
      reviewed_workflow_commit: ${{ steps.prepare.outputs.reviewed_workflow_commit }}
      target_mode: ${{ steps.prepare.outputs.target_mode }}
      private_endpoint: ${{ steps.prepare.outputs.private_endpoint }}
      private_key_file: ${{ steps.prepare.outputs.private_key_file }}
      snapshot_artifact_name: ${{ steps.prepare.outputs.snapshot_artifact_name }}

    steps:
      - name: Check out the reviewed workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Download the data-only publication request
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: private-artifact-request
          path: ${{ runner.temp }}/private-artifact-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Enforce the reviewed allowlist before installation
        id: prepare
        env:
          PRIVATE_ARTIFACT_EVENT: ${{ github.event_name }}
          PRIVATE_ARTIFACT_HEAD_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          PRIVATE_ARTIFACT_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'success' }}
          PRIVATE_ARTIFACT_WORKFLOW_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || '' }}
          PRIVATE_ARTIFACT_WORKFLOW_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          PRIVATE_ARTIFACT_TARGET_REF: ${{ github.event_name == 'push' && 'refs/heads/master' || '' }}
        run: |
          test "$(node --version)" = 'v24.18.0' || { echo "::error::expected Node v24.18.0, got $(node --version)"; exit 1; }
          node scripts/private-artifact-release.mjs prepare \
            --event "$PRIVATE_ARTIFACT_EVENT" \
            --head-branch "$PRIVATE_ARTIFACT_HEAD_BRANCH" \
            --conclusion "$PRIVATE_ARTIFACT_CONCLUSION" \
            --workflow-name "$PRIVATE_ARTIFACT_WORKFLOW_NAME" \
            --request "$RUNNER_TEMP/private-artifact-request/request.json" \
            --target-ref "$PRIVATE_ARTIFACT_TARGET_REF" \
            --workflow-commit "$PRIVATE_ARTIFACT_WORKFLOW_COMMIT" \
            --output "$RUNNER_TEMP/private-target-snapshot"

      - name: Stage immutable target attestation and publisher verifier
        if: steps.prepare.outputs.publish_private_artifact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.prepare.outputs.snapshot_artifact_name }}
          path: ${{ runner.temp }}/private-target-snapshot
          if-no-files-found: error
          retention-days: 1

  check-repository-ci:
    name: 'check: repository-ci'
    needs: check-publication-request
    if: >-
      needs.check-publication-request.result == 'success' &&
      needs.check-publication-request.outputs.publish_private_artifact == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.check-publication-request.outputs.source_commit }}

  check-deployment-stack:
    name: 'check: deployment-stack'
    needs: check-publication-request
    if: >-
      needs.check-publication-request.result == 'success' &&
      needs.check-publication-request.outputs.publish_private_artifact == 'true'
    uses: ./.github/workflows/deployment-stack-checks.yml
    with:
      checkout_ref: ${{ needs.check-publication-request.outputs.source_commit }}

  build-private-artifact:
    name: 'build: private-artifact'
    needs:
      - check-publication-request
      - check-repository-ci
      - check-deployment-stack
    if: >-
      needs.check-publication-request.result == 'success' &&
      needs.check-publication-request.outputs.publish_private_artifact == 'true' &&
      needs.check-repository-ci.result == 'success' &&
      needs.check-deployment-stack.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_digest_hex: ${{ steps.verify.outputs.artifact_digest_hex }}

    steps:
      - name: Check out the allowlisted target commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.check-publication-request.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the immutable target snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.check-publication-request.outputs.snapshot_artifact_name }}
          path: ${{ runner.temp }}/private-target-snapshot

      - name: Set up Node.js 24.18.0 before target validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Validate the immutable target before installation
        env:
          MTPROTO_TARGET_MODE: ${{ needs.check-publication-request.outputs.target_mode }}
          MTPROTO_PRIVATE_ENDPOINT: ${{ needs.check-publication-request.outputs.private_endpoint }}
          MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE: ${{ runner.temp }}/private-target-snapshot/${{ needs.check-publication-request.outputs.private_key_file }}
        run: |
          test "$(node --version)" = 'v24.18.0' || { echo "::error::expected Node v24.18.0, got $(node --version)"; exit 1; }
          node scripts/private-artifact-release.mjs validate-target --snapshot "$RUNNER_TEMP/private-target-snapshot"

      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: 11.16.0

      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Revalidate the immutable target after installation
        env:
          MTPROTO_TARGET_MODE: ${{ needs.check-publication-request.outputs.target_mode }}
          MTPROTO_PRIVATE_ENDPOINT: ${{ needs.check-publication-request.outputs.private_endpoint }}
          MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE: ${{ runner.temp }}/private-target-snapshot/${{ needs.check-publication-request.outputs.private_key_file }}
        run: |
          test "$(node --version)" = 'v24.18.0' || { echo "::error::expected Node v24.18.0, got $(node --version)"; exit 1; }
          node scripts/private-artifact-release.mjs validate-target --snapshot "$RUNNER_TEMP/private-target-snapshot"

      - name: Run private negative-input and route-matrix tests
        run: >-
          pnpm exec vitest run
          scripts/mtproto-target.test.mjs
          scripts/mtproto-worker-routing.test.mjs
          src/tests/mtprotoRouting.test.ts
          src/tests/privateMtprotoEgress.test.ts
          src/tests/mtprotoWorkerReady.test.ts
          src/tests/superMessagePort.test.ts

      - name: Build reviewed private artifact
        env:
          MTPROTO_TARGET_MODE: ${{ needs.check-publication-request.outputs.target_mode }}
          MTPROTO_PRIVATE_ENDPOINT: ${{ needs.check-publication-request.outputs.private_endpoint }}
          MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE: ${{ runner.temp }}/private-target-snapshot/${{ needs.check-publication-request.outputs.private_key_file }}
        run: pnpm exec vite build --outDir dist-private

      - name: Require the reviewed font assets in the private artifact
        run: |
          test -s dist-private/assets/fonts/KFOmCnqEu92Fr1Mu5mxKKTU1Kvnz.woff2
          test -s dist-private/assets/fonts/tgico.woff

      - name: Audit bundle routes, keys, and digest
        env:
          MTPROTO_TARGET_MODE: ${{ needs.check-publication-request.outputs.target_mode }}
          MTPROTO_PRIVATE_ENDPOINT: ${{ needs.check-publication-request.outputs.private_endpoint }}
          MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE: ${{ runner.temp }}/private-target-snapshot/${{ needs.check-publication-request.outputs.private_key_file }}
        run: pnpm run check-bundle -- dist-private

      - name: Audit runtime public assets
        run: pnpm run check:private-artifact-assets -- dist-private

      - name: Verify CSP, manifest, digest, and source commit
        id: verify
        env:
          MTPROTO_TARGET_MODE: ${{ needs.check-publication-request.outputs.target_mode }}
          MTPROTO_PRIVATE_ENDPOINT: ${{ needs.check-publication-request.outputs.private_endpoint }}
          MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE: ${{ runner.temp }}/private-target-snapshot/${{ needs.check-publication-request.outputs.private_key_file }}
        run: >-
          pnpm run verify-private-artifact --
          --dist dist-private
          --snapshot "$RUNNER_TEMP/private-target-snapshot"
          --ref "${{ needs.check-publication-request.outputs.source_ref }}"
          --commit "${{ needs.check-publication-request.outputs.source_commit }}"

      - name: Build the reviewed web image for publication
        env:
          IMAGE_REF: ghcr.io/teagramhq/teagram-web:${{ needs.check-publication-request.outputs.source_commit }}
          PRIVATE_ARTIFACT_COMMIT: ${{ needs.check-publication-request.outputs.source_commit }}
          PRIVATE_ARTIFACT_DIGEST: sha256:${{ steps.verify.outputs.artifact_digest_hex }}
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --file deploy/teagram-web/Dockerfile \
            --build-arg PRIVATE_ARTIFACT_COMMIT="$PRIVATE_ARTIFACT_COMMIT" \
            --label "org.opencontainers.image.source=https://github.com/teagramhq/teagram-web" \
            --label "org.opencontainers.image.revision=$PRIVATE_ARTIFACT_COMMIT" \
            --label "com.teagram.private-artifact.digest=$PRIVATE_ARTIFACT_DIGEST" \
            --tag "$IMAGE_REF" \
            .
          docker save --output "$RUNNER_TEMP/teagram-web-image.tar" "$IMAGE_REF"

      - name: Stage audited artifact for the isolated publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-mtproto-staged-${{ needs.check-publication-request.outputs.source_commit }}-${{ steps.verify.outputs.artifact_digest_hex }}
          path: dist-private
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Stage reviewed web image for the isolated publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teagram-web-image-staged-${{ needs.check-publication-request.outputs.source_commit }}-${{ steps.verify.outputs.artifact_digest_hex }}
          path: ${{ runner.temp }}/teagram-web-image.tar
          if-no-files-found: error
          retention-days: 1

  publish-private-artifact:
    name: 'publish: private-artifact'
    needs:
      - check-publication-request
      - build-private-artifact
    if: >-
      needs.check-publication-request.result == 'success' &&
      needs.check-publication-request.outputs.publish_private_artifact == 'true' &&
      needs.build-private-artifact.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Download the verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: private-mtproto-staged-${{ needs.check-publication-request.outputs.source_commit }}-${{ needs.build-private-artifact.outputs.artifact_digest_hex }}
          path: dist-private

      - name: Download the immutable target snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.check-publication-request.outputs.snapshot_artifact_name }}
          path: ${{ runner.temp }}/private-target-snapshot

      - name: Reverify the downloaded unit in the isolated publisher
        run: |
          test "$(node --version)" = 'v24.18.0' || { echo "::error::expected Node v24.18.0, got $(node --version)"; exit 1; }
          node "$RUNNER_TEMP/private-target-snapshot/publisher-verify.mjs" \
            --dist dist-private \
            --snapshot "$RUNNER_TEMP/private-target-snapshot" \
            --ref "${{ needs.check-publication-request.outputs.source_ref }}" \
            --commit "${{ needs.check-publication-request.outputs.source_commit }}" \
            --digest "${{ needs.build-private-artifact.outputs.artifact_digest_hex }}"

      - name: Publish artifact and sidecar as one release unit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-mtproto-${{ needs.check-publication-request.outputs.source_commit }}-${{ needs.build-private-artifact.outputs.artifact_digest_hex }}
          path: dist-private
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish-teagram-web-image:
    name: 'publish: teagram-web-image'
    needs:
      - check-publication-request
      - build-private-artifact
      - publish-private-artifact
    if: >-
      needs.check-publication-request.result == 'success' &&
      needs.check-publication-request.outputs.publish_private_artifact == 'true' &&
      needs.build-private-artifact.result == 'success' &&
      needs.publish-private-artifact.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      packages: write

    steps:
      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Download the immutable target snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.check-publication-request.outputs.snapshot_artifact_name }}
          path: ${{ runner.temp }}/private-target-snapshot

      - name: Download the staged reviewed web image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: teagram-web-image-staged-${{ needs.check-publication-request.outputs.source_commit }}-${{ needs.build-private-artifact.outputs.artifact_digest_hex }}
          path: ${{ runner.temp }}/teagram-web-image

      - name: Load and verify the reviewed web image
        env:
          IMAGE_REF: ghcr.io/teagramhq/teagram-web:${{ needs.check-publication-request.outputs.source_commit }}
          SOURCE_COMMIT: ${{ needs.check-publication-request.outputs.source_commit }}
          ARTIFACT_DIGEST: sha256:${{ needs.build-private-artifact.outputs.artifact_digest_hex }}
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/teagram-web-image/teagram-web-image.tar"
          image_labels="$(docker image inspect "$IMAGE_REF" --format '{{ json .Config.Labels }}')"
          jq -e \
            --arg commit "$SOURCE_COMMIT" \
            --arg digest "$ARTIFACT_DIGEST" \
            '."org.opencontainers.image.revision" == $commit and ."com.teagram.private-artifact.digest" == $digest' \
            <<<"$image_labels" >/dev/null
          container_id="$(docker create "$IMAGE_REF")"
          trap 'docker rm "$container_id" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/teagram-web-image-content"
          docker cp "$container_id:/usr/share/nginx/html/." "$RUNNER_TEMP/teagram-web-image-content/"
          node "$RUNNER_TEMP/private-target-snapshot/publisher-verify.mjs" \
            --dist "$RUNNER_TEMP/teagram-web-image-content" \
            --snapshot "$RUNNER_TEMP/private-target-snapshot" \
            --ref "${{ needs.check-publication-request.outputs.source_ref }}" \
            --commit "$SOURCE_COMMIT" \
            --digest "${{ needs.build-private-artifact.outputs.artifact_digest_hex }}"

      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the reviewed web image and record its digest
        id: web-image-push
        env:
          IMAGE_REF: ghcr.io/teagramhq/teagram-web:${{ needs.check-publication-request.outputs.source_commit }}
          SOURCE_COMMIT: ${{ needs.check-publication-request.outputs.source_commit }}
          ARTIFACT_DIGEST: sha256:${{ needs.build-private-artifact.outputs.artifact_digest_hex }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF" | tee "$RUNNER_TEMP/teagram-web-image-push.log"
          image_digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}) size:.*/\1/p' "$RUNNER_TEMP/teagram-web-image-push.log" | tail -n 1)"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'container registry did not report a valid image digest' >&2
            exit 1
          fi
          image_digest_hex="${image_digest#sha256:}"
          jq -n \
            --arg image "ghcr.io/teagramhq/teagram-web@$image_digest" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            '{image: $image, sourceCommit: $source_commit, artifactDigest: $artifact_digest}' \
            >"$RUNNER_TEMP/teagram-web-image-pin.json"
          printf 'image_digest_hex=%s\n' "$image_digest_hex" >>"$GITHUB_OUTPUT"

      - name: Publish the immutable web image pin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teagram-web-image-pin-${{ needs.check-publication-request.outputs.source_commit }}-${{ steps.web-image-push.outputs.image_digest_hex }}
          path: ${{ runner.temp }}/teagram-web-image-pin.json
          if-no-files-found: error
          retention-days: 30

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
