name: Deploy.

run-name: ${{ inputs.issue && format('{0} [{1}]', github.workflow, inputs.issue) || '' }}

# Deploy only image pins published from successful master commits. The image
# pin identifies both the web source commit and the audited private artifact.
on:
  workflow_run:
    workflows: [Private MTProto Artifact Publication]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue key to report this run to (e.g. MAIN-123). Leave empty for no report."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  check-published-image-pin:
    name: 'check: published-image-pin'
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.target.outputs.skip }}
      sha: ${{ steps.target.outputs.sha }}
      run_id: ${{ steps.target.outputs.run_id }}
      artifact_name: ${{ steps.target.outputs.artifact_name }}
      image_digest: ${{ steps.target.outputs.image_digest }}

    steps:
      - name: Resolve the published web image pin
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          artifact_for_run() {
            local candidate_run_id="$1" candidate_sha="$2" artifacts matches
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100") || return 2
            matches=$(jq -r --arg sha "$candidate_sha" \
              '[.artifacts[]? | select(.expired != true and (.name | test("^teagram-web-image-pin-" + $sha + "-[0-9a-f]{64}$"))) | .name] | .[]' \
              <<<"$artifacts") || return 2
            [[ -n "$matches" ]] || return 1
            [[ "$matches" != *$'\n'* && "$matches" =~ ^teagram-web-image-pin-${candidate_sha}-([0-9a-f]{64})$ ]] || return 2
            printf '%s\t%s\n' "$matches" "${BASH_REMATCH[1]}"
          }

          latest_publication() {
            local runs candidate_run_id candidate_sha artifact artifact_name image_digest result
            runs=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/private-artifact.yml/runs?branch=master&event=push&status=success&per_page=100" \
              --jq '.workflow_runs[] | [.id, .head_sha] | @tsv') || return 1
            while IFS=$'\t' read -r candidate_run_id candidate_sha; do
              [[ -n "$candidate_run_id" ]] || continue
              [[ "$candidate_run_id" =~ ^[0-9]+$ && "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
              if artifact=$(artifact_for_run "$candidate_run_id" "$candidate_sha"); then
                IFS=$'\t' read -r artifact_name image_digest <<<"$artifact"
                printf '%s\t%s\t%s\t%s\n' "$candidate_run_id" "$candidate_sha" "$artifact_name" "$image_digest"
                return 0
              else
                result=$?
                [[ "$result" == 1 ]] || return 1
              fi
            done <<<"$runs"
            return 1
          }

          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            if [[ ! "$RUN_ID" =~ ^[0-9]+$ || ! "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::invalid publication run metadata"
              exit 1
            fi

            if event_pin=$(artifact_for_run "$RUN_ID" "$RUN_HEAD_SHA"); then
              IFS=$'\t' read -r event_artifact_name event_image_digest <<<"$event_pin"
            else
              result=$?
              if [[ "$result" == 1 ]]; then
                echo "::notice::publication run $RUN_ID produced no matching web image pin; skipping deployment"
                printf 'skip=true\n' > "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::could not verify the web image pin for publication run $RUN_ID"
              exit 1
            fi
          fi

          latest=$(latest_publication) || {
            echo "::error::no successful web image publication found on master"
            exit 1
          }
          IFS=$'\t' read -r latest_run_id latest_sha latest_artifact_name latest_image_digest <<<"$latest"

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            run_id="$latest_run_id"
            sha="$latest_sha"
            artifact_name="$latest_artifact_name"
            image_digest="$latest_image_digest"
          else
            sha="$RUN_HEAD_SHA"
            run_id="$RUN_ID"
            artifact_name="$event_artifact_name"
            image_digest="$event_image_digest"
            comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$latest_sha" --jq '.status') || {
              echo "::error::could not compare publication commits"
              exit 1
            }
            if [[ "$comparison" == ahead || "$comparison" == identical ]]; then
              sha="$latest_sha"
              run_id="$latest_run_id"
              artifact_name="$latest_artifact_name"
              image_digest="$latest_image_digest"
            elif [[ "$comparison" != behind && "$comparison" != diverged ]]; then
              echo "::error::unexpected publication comparison '$comparison'"
              exit 1
            fi
          fi

          [[ "$artifact_name" =~ ^teagram-web-image-pin-${sha}-([0-9a-f]{64})$ && "${BASH_REMATCH[1]}" == "$image_digest" ]] || {
            echo "::error::selected web image pin does not match commit $sha"
            exit 1
          }
          echo "deploying web image for $sha from publication run $run_id"
          {
            printf 'skip=false\n'
            printf 'sha=%s\n' "$sha"
            printf 'run_id=%s\n' "$run_id"
            printf 'artifact_name=%s\n' "$artifact_name"
            printf 'image_digest=%s\n' "$image_digest"
          } > "$GITHUB_OUTPUT"

  deploy-web:
    name: 'deploy: web (prod)'
    needs: check-published-image-pin
    if: ${{ needs.check-published-image-pin.outputs.skip == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: deploy-teagram-web
      cancel-in-progress: false
    environment: k3s-prod
    permissions:
      contents: read
      actions: read

    steps:
      - name: Refresh the published web image after acquiring deployment slot
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.check-published-image-pin.outputs.sha }}
          BASE_RUN_ID: ${{ needs.check-published-image-pin.outputs.run_id }}
          BASE_ARTIFACT_NAME: ${{ needs.check-published-image-pin.outputs.artifact_name }}
          BASE_IMAGE_DIGEST: ${{ needs.check-published-image-pin.outputs.image_digest }}
        run: |
          artifact_for_run() {
            local candidate_run_id="$1" candidate_sha="$2" artifacts matches
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100") || return 2
            matches=$(jq -r --arg sha "$candidate_sha" \
              '[.artifacts[]? | select(.expired != true and (.name | test("^teagram-web-image-pin-" + $sha + "-[0-9a-f]{64}$"))) | .name] | .[]' \
              <<<"$artifacts") || return 2
            [[ -n "$matches" ]] || return 1
            [[ "$matches" != *$'\n'* && "$matches" =~ ^teagram-web-image-pin-${candidate_sha}-([0-9a-f]{64})$ ]] || return 2
            printf '%s\t%s\n' "$matches" "${BASH_REMATCH[1]}"
          }

          latest_publication() {
            local runs candidate_run_id candidate_sha artifact artifact_name image_digest result
            runs=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/private-artifact.yml/runs?branch=master&event=push&status=success&per_page=100" \
              --jq '.workflow_runs[] | [.id, .head_sha] | @tsv') || return 1
            while IFS=$'\t' read -r candidate_run_id candidate_sha; do
              [[ -n "$candidate_run_id" ]] || continue
              [[ "$candidate_run_id" =~ ^[0-9]+$ && "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
              if artifact=$(artifact_for_run "$candidate_run_id" "$candidate_sha"); then
                IFS=$'\t' read -r artifact_name image_digest <<<"$artifact"
                printf '%s\t%s\t%s\t%s\n' "$candidate_run_id" "$candidate_sha" "$artifact_name" "$image_digest"
                return 0
              else
                result=$?
                [[ "$result" == 1 ]] || return 1
              fi
            done <<<"$runs"
            return 1
          }

          [[ "$BASE_RUN_ID" =~ ^[0-9]+$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::invalid pre-resolved publication metadata"
            exit 1
          }
          [[ "$BASE_ARTIFACT_NAME" =~ ^teagram-web-image-pin-${BASE_SHA}-([0-9a-f]{64})$ && "${BASH_REMATCH[1]}" == "$BASE_IMAGE_DIGEST" ]] || {
            echo "::error::pre-resolved web image pin does not match commit $BASE_SHA"
            exit 1
          }

          latest=$(latest_publication) || {
            echo "::error::no successful web image publication found on master"
            exit 1
          }
          IFS=$'\t' read -r latest_run_id latest_sha latest_artifact_name latest_image_digest <<<"$latest"
          comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$latest_sha" --jq '.status') || {
            echo "::error::could not compare publication commits after acquiring deployment slot"
            exit 1
          }

          run_id="$BASE_RUN_ID"
          sha="$BASE_SHA"
          artifact_name="$BASE_ARTIFACT_NAME"
          image_digest="$BASE_IMAGE_DIGEST"
          if [[ "$comparison" == ahead || "$comparison" == identical ]]; then
            run_id="$latest_run_id"
            sha="$latest_sha"
            artifact_name="$latest_artifact_name"
            image_digest="$latest_image_digest"
          elif [[ "$comparison" != behind && "$comparison" != diverged ]]; then
            echo "::error::unexpected publication comparison '$comparison' after acquiring deployment slot"
            exit 1
          fi

          [[ "$artifact_name" =~ ^teagram-web-image-pin-${sha}-([0-9a-f]{64})$ && "${BASH_REMATCH[1]}" == "$image_digest" ]] || {
            echo "::error::refreshed web image pin does not match commit $sha"
            exit 1
          }
          echo "deploying refreshed web image for $sha from publication run $run_id"
          {
            printf 'sha=%s\n' "$sha"
            printf 'run_id=%s\n' "$run_id"
            printf 'artifact_name=%s\n' "$artifact_name"
            printf 'image_digest=%s\n' "$image_digest"
          } > "$GITHUB_OUTPUT"

      - name: Check out the published source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.refresh.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the published web image pin
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.refresh.outputs.artifact_name }}
          path: ${{ runner.temp }}/web-image-pin
          run-id: ${{ steps.refresh.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the source commit and image pin
        id: pin
        env:
          DEPLOY_SHA: ${{ steps.refresh.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.refresh.outputs.image_digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          pin="$RUNNER_TEMP/web-image-pin/teagram-web-image-pin.json"
          test -f "$pin" && test ! -L "$pin"
          jq -e --arg sha "$DEPLOY_SHA" \
            --arg image "ghcr.io/teagramhq/teagram-web@sha256:$IMAGE_DIGEST" \
            '.sourceCommit == $sha and .image == $image and (.artifactDigest | test("^sha256:[0-9a-f]{64}$"))' \
            "$pin" >/dev/null
          printf 'artifact_digest=%s\n' "$(jq -r '.artifactDigest' "$pin")" >> "$GITHUB_OUTPUT"

      - name: Render the production web overlay
        env:
          DEPLOY_SHA: ${{ steps.refresh.outputs.sha }}
        run: |
          set -euo pipefail
          python3 deploy/k8s/render.py \
            --pin "$RUNNER_TEMP/web-image-pin/teagram-web-image-pin.json" \
            --source-commit "$DEPLOY_SHA" > "$RUNNER_TEMP/teagram-web-prod.yaml"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy

      - name: Install kubectl for the production k3s version
        env:
          KUBERNETES_VERSION: 1.37.1
        run: bash .github/scripts/install-kubectl.sh

      - name: Install the deploy kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_CONTENT"
          install -d -m 700 "$RUNNER_TEMP/k8s"
          (umask 077 && printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/k8s/config")
          printf 'KUBECONFIG=%s\n' "$RUNNER_TEMP/k8s/config" >> "$GITHUB_ENV"

      - name: Deploy, verify the public route, and roll back on failure
        env:
          DEPLOY_SHA: ${{ steps.refresh.outputs.sha }}
          ARTIFACT_DIGEST: ${{ steps.pin.outputs.artifact_digest }}
          DEPLOY_IMAGE: ghcr.io/teagramhq/teagram-web@sha256:${{ steps.refresh.outputs.image_digest }}
          REQUIRE_SINGLE_CLOUDFLARED: 'true'
          SMOKE_URL: https://web.teagram.io/
        run: |
          bash .github/scripts/deploy-k8s-web.sh \
            "$RUNNER_TEMP/teagram-web-prod.yaml" \
            "$DEPLOY_SHA" "$ARTIFACT_DIGEST" "$DEPLOY_IMAGE" "$SMOKE_URL"

      - name: Remove the deploy kubeconfig
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/k8s/config"
