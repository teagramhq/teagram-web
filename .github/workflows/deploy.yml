name: Deploy.

run-name: ${{ inputs.issue && format('{0} [{1}]', github.workflow, inputs.issue) || '' }}

# Keep both origins on one audited image pin across concurrent publications.
concurrency:
  group: deploy-teagram-web
  cancel-in-progress: false

# Deploy only image pins published from successful master commits. The image
# pin identifies both the web source commit and the audited private artifact.
on:
  workflow_run:
    workflows: [Private MTProto Artifact Publication]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue key to report this run to (e.g. MAIN-123). Leave empty for no report."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  check-published-image-pin:
    name: 'check: published-image-pin'
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.target.outputs.skip }}
      sha: ${{ steps.target.outputs.sha }}
      run_id: ${{ steps.target.outputs.run_id }}
      artifact_name: ${{ steps.target.outputs.artifact_name }}
      image_digest: ${{ steps.target.outputs.image_digest }}
      origin: ${{ steps.target.outputs.origin }}

    steps:
      - name: Resolve the published web image pin
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
        run: |
          origin="${WEB_ORIGIN:-k3s}"
          [[ "$origin" == k3s || "$origin" == pages ]] || {
            echo '::error::WEB_ORIGIN must be k3s or pages'
            exit 1
          }

          pin_prefix='teagram-web-image-pin-'

          artifact_for_run() {
            local candidate_run_id="$1" candidate_sha="$2" artifacts matches match_count match
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100") || return 2
            matches=$(jq -cer --arg sha "$candidate_sha" --arg prefix "$pin_prefix" '
              if (.artifacts | type) != "array" then error("artifacts must be an array")
              elif any(.artifacts[]; (.name | type) != "string" or (.expired | type) != "boolean") then
                error("artifact metadata is malformed")
              else
                [.artifacts[] | select(.expired != true and (.name | test("^" + $prefix + $sha + "-[0-9a-f]{64}$"))) | .name]
              end
            ' <<<"$artifacts") || return 2
            match_count=$(jq -r 'length' <<<"$matches") || return 2
            [[ "$match_count" == 0 ]] && return 1
            [[ "$match_count" == 1 ]] || return 2
            match=$(jq -er '.[0]' <<<"$matches") || return 2
            [[ "$match" =~ ^${pin_prefix}${candidate_sha}-([0-9a-f]{64})$ ]] || return 2
            printf '%s\t%s\n' "$match" "${BASH_REMATCH[1]}"
          }

          publication_job_conclusion() {
            local candidate_run_id="$1" jobs conclusion
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?per_page=100") || return 2
            conclusion=$(jq -er '
              [.jobs[]? | select(.name == "publish: teagram-web-image") | .conclusion] | unique |
              if length == 1 and (.[0] | type == "string" and length > 0) then .[0]
              else error("expected one web image publication job conclusion") end
            ' <<<"$jobs") || return 2
            printf '%s\n' "$conclusion"
          }

          latest_publication() {
            local runs candidate_run_id candidate_sha artifact artifact_name image_digest result
            runs=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/private-artifact.yml/runs?branch=master&event=push&status=success&per_page=100" \
              --jq 'if (.workflow_runs | type) != "array" then error("workflow_runs must be an array") elif any(.workflow_runs[]; (.id | type) != "number" or (.head_sha | type) != "string") then error("workflow run metadata is malformed") else .workflow_runs[] | [.id, .head_sha] | @tsv end') || return 2
            while IFS=$'\t' read -r candidate_run_id candidate_sha; do
              [[ -n "$candidate_run_id" ]] || continue
              [[ "$candidate_run_id" =~ ^[0-9]+$ && "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || return 2
              if artifact=$(artifact_for_run "$candidate_run_id" "$candidate_sha"); then
                IFS=$'\t' read -r artifact_name image_digest <<<"$artifact"
                printf '%s\t%s\t%s\t%s\n' "$candidate_run_id" "$candidate_sha" "$artifact_name" "$image_digest"
                return 0
              else
                result=$?
                [[ "$result" == 1 ]] || return "$result"
              fi
            done <<<"$runs"
            return 1
          }

          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            if [[ ! "$RUN_ID" =~ ^[0-9]+$ || ! "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::invalid publication run metadata"
              exit 1
            fi

            if event_pin=$(artifact_for_run "$RUN_ID" "$RUN_HEAD_SHA"); then
              IFS=$'\t' read -r event_artifact_name event_image_digest <<<"$event_pin"
            else
              result=$?
              if [[ "$result" == 1 ]]; then
                if publication_conclusion=$(publication_job_conclusion "$RUN_ID"); then
                  if [[ "$publication_conclusion" == skipped ]]; then
                    echo "::notice::web image publication job was skipped for run $RUN_ID; skipping deployment"
                    printf 'skip=true\n' > "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if [[ "$publication_conclusion" == success ]]; then
                    echo "::error::web image publication job succeeded in run $RUN_ID but its image pin is missing"
                  else
                    echo "::error::web image publication job in run $RUN_ID has unexpected conclusion '$publication_conclusion'"
                  fi
                else
                  echo "::error::could not verify the web image publication job for run $RUN_ID"
                fi
                exit 1
              fi
              echo "::error::could not verify the web image pin for publication run $RUN_ID"
              exit 1
            fi
          fi

          if latest=$(latest_publication); then
            :
          else
            result=$?
            if [[ "$result" == 1 ]]; then
              echo "::error::no successful web image publication found on master"
            else
              echo "::error::could not query or validate successful web image publications on master"
            fi
            exit 1
          fi
          IFS=$'\t' read -r latest_run_id latest_sha latest_artifact_name latest_image_digest <<<"$latest"

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            run_id="$latest_run_id"
            sha="$latest_sha"
            artifact_name="$latest_artifact_name"
            image_digest="$latest_image_digest"
          else
            sha="$RUN_HEAD_SHA"
            run_id="$RUN_ID"
            artifact_name="$event_artifact_name"
            image_digest="$event_image_digest"
            comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$latest_sha" --jq '.status') || {
              echo "::error::could not compare publication commits"
              exit 1
            }
            if [[ "$comparison" == ahead || "$comparison" == identical ]]; then
              sha="$latest_sha"
              run_id="$latest_run_id"
              artifact_name="$latest_artifact_name"
              image_digest="$latest_image_digest"
            elif [[ "$comparison" == behind ]]; then
              echo "latest publication $latest_sha is behind; keeping event SHA $sha"
            elif [[ "$comparison" == diverged ]]; then
              echo "::error::publication commits $sha and $latest_sha have diverged"
              exit 1
            else
              echo "::error::unexpected publication comparison '$comparison'"
              exit 1
            fi
          fi

          [[ "$artifact_name" =~ ^${pin_prefix}${sha}-([0-9a-f]{64})$ && "${BASH_REMATCH[1]}" == "$image_digest" ]] || {
            echo "::error::selected web image pin does not match commit $sha"
            exit 1
          }
          echo "deploying web image for $sha from publication run $run_id"
          {
            printf 'skip=false\n'
            printf 'sha=%s\n' "$sha"
            printf 'run_id=%s\n' "$run_id"
            printf 'artifact_name=%s\n' "$artifact_name"
            printf 'image_digest=%s\n' "$image_digest"
            printf 'origin=%s\n' "$origin"
          } > "$GITHUB_OUTPUT"

  deploy-web:
    name: 'deploy: web (prod)'
    needs: check-published-image-pin
    if: ${{ needs.check-published-image-pin.outputs.skip == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: k3s-prod
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.refresh.outputs.sha }}
      run_id: ${{ steps.refresh.outputs.run_id }}
      artifact_name: ${{ steps.refresh.outputs.artifact_name }}
      image_digest: ${{ steps.refresh.outputs.image_digest }}

    steps:
      - name: Refresh the published web image after acquiring deployment slot
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.check-published-image-pin.outputs.sha }}
          BASE_RUN_ID: ${{ needs.check-published-image-pin.outputs.run_id }}
          BASE_ARTIFACT_NAME: ${{ needs.check-published-image-pin.outputs.artifact_name }}
          BASE_IMAGE_DIGEST: ${{ needs.check-published-image-pin.outputs.image_digest }}
        run: |
          pin_prefix='teagram-web-image-pin-'

          artifact_for_run() {
            local candidate_run_id="$1" candidate_sha="$2" artifacts matches match_count match
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100") || return 2
            matches=$(jq -cer --arg sha "$candidate_sha" --arg prefix "$pin_prefix" '
              if (.artifacts | type) != "array" then error("artifacts must be an array")
              elif any(.artifacts[]; (.name | type) != "string" or (.expired | type) != "boolean") then
                error("artifact metadata is malformed")
              else
                [.artifacts[] | select(.expired != true and (.name | test("^" + $prefix + $sha + "-[0-9a-f]{64}$"))) | .name]
              end
            ' <<<"$artifacts") || return 2
            match_count=$(jq -r 'length' <<<"$matches") || return 2
            [[ "$match_count" == 0 ]] && return 1
            [[ "$match_count" == 1 ]] || return 2
            match=$(jq -er '.[0]' <<<"$matches") || return 2
            [[ "$match" =~ ^${pin_prefix}${candidate_sha}-([0-9a-f]{64})$ ]] || return 2
            printf '%s\t%s\n' "$match" "${BASH_REMATCH[1]}"
          }

          latest_publication() {
            local runs candidate_run_id candidate_sha artifact artifact_name image_digest result
            runs=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/private-artifact.yml/runs?branch=master&event=push&status=success&per_page=100" \
              --jq 'if (.workflow_runs | type) != "array" then error("workflow_runs must be an array") elif any(.workflow_runs[]; (.id | type) != "number" or (.head_sha | type) != "string") then error("workflow run metadata is malformed") else .workflow_runs[] | [.id, .head_sha] | @tsv end') || return 2
            while IFS=$'\t' read -r candidate_run_id candidate_sha; do
              [[ -n "$candidate_run_id" ]] || continue
              [[ "$candidate_run_id" =~ ^[0-9]+$ && "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || return 2
              if artifact=$(artifact_for_run "$candidate_run_id" "$candidate_sha"); then
                IFS=$'\t' read -r artifact_name image_digest <<<"$artifact"
                printf '%s\t%s\t%s\t%s\n' "$candidate_run_id" "$candidate_sha" "$artifact_name" "$image_digest"
                return 0
              else
                result=$?
                [[ "$result" == 1 ]] || return "$result"
              fi
            done <<<"$runs"
            return 1
          }

          [[ "$BASE_RUN_ID" =~ ^[0-9]+$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::invalid pre-resolved publication metadata"
            exit 1
          }
          [[ "$BASE_ARTIFACT_NAME" =~ ^teagram-web-image-pin-${BASE_SHA}-([0-9a-f]{64})$ && "${BASH_REMATCH[1]}" == "$BASE_IMAGE_DIGEST" ]] || {
            echo "::error::pre-resolved web image pin does not match commit $BASE_SHA"
            exit 1
          }

          if latest=$(latest_publication); then
            :
          else
            result=$?
            if [[ "$result" == 1 ]]; then
              echo "::error::no successful web image publication found on master"
            else
              echo "::error::could not query or validate successful web image publications on master"
            fi
            exit 1
          fi
          IFS=$'\t' read -r latest_run_id latest_sha latest_artifact_name latest_image_digest <<<"$latest"
          comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$latest_sha" --jq '.status') || {
            echo "::error::could not compare publication commits after acquiring deployment slot"
            exit 1
          }

          run_id="$BASE_RUN_ID"
          sha="$BASE_SHA"
          artifact_name="$BASE_ARTIFACT_NAME"
          image_digest="$BASE_IMAGE_DIGEST"
          if [[ "$comparison" == ahead || "$comparison" == identical ]]; then
            run_id="$latest_run_id"
            sha="$latest_sha"
            artifact_name="$latest_artifact_name"
            image_digest="$latest_image_digest"
          elif [[ "$comparison" == behind ]]; then
            echo "latest publication $latest_sha is behind; keeping pre-resolved SHA $sha"
          elif [[ "$comparison" == diverged ]]; then
            echo "::error::publication commits $BASE_SHA and $latest_sha have diverged after acquiring the deployment slot"
            exit 1
          else
            echo "::error::unexpected publication comparison '$comparison' after acquiring deployment slot"
            exit 1
          fi

          [[ "$artifact_name" =~ ^${pin_prefix}${sha}-([0-9a-f]{64})$ && "${BASH_REMATCH[1]}" == "$image_digest" ]] || {
            echo "::error::refreshed web image pin does not match commit $sha"
            exit 1
          }
          echo "deploying refreshed web image for $sha from publication run $run_id"
          {
            printf 'sha=%s\n' "$sha"
            printf 'run_id=%s\n' "$run_id"
            printf 'artifact_name=%s\n' "$artifact_name"
            printf 'image_digest=%s\n' "$image_digest"
          } > "$GITHUB_OUTPUT"

      - name: Check out the published source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.refresh.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the published web image pin
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.refresh.outputs.artifact_name }}
          path: ${{ runner.temp }}/web-image-pin
          run-id: ${{ steps.refresh.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the source commit and image pin
        id: pin
        env:
          DEPLOY_SHA: ${{ steps.refresh.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.refresh.outputs.image_digest }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)" || {
            echo '::error::could not read the checked out source commit'
            exit 1
          }
          [[ "$actual_sha" == "$DEPLOY_SHA" ]] || {
            echo "::error::checked out source commit $actual_sha does not match publication SHA $DEPLOY_SHA"
            exit 1
          }
          pin="$RUNNER_TEMP/web-image-pin/teagram-web-image-pin.json"
          [[ -f "$pin" && ! -L "$pin" ]] || {
            echo '::error::downloaded image pin must be a regular, non-symlink file'
            exit 1
          }
          jq -e --arg sha "$DEPLOY_SHA" \
            --arg image "ghcr.io/teagramhq/teagram-web@sha256:$IMAGE_DIGEST" \
            '.sourceCommit == $sha and .image == $image and (.artifactDigest | test("^sha256:[0-9a-f]{64}$"))' \
            "$pin" >/dev/null || {
              echo '::error::downloaded image pin metadata does not match the selected source and image digest'
              exit 1
            }
          printf 'artifact_digest=%s\n' "$(jq -r '.artifactDigest' "$pin")" >> "$GITHUB_OUTPUT"

      - name: Render the production web overlay
        env:
          DEPLOY_SHA: ${{ steps.refresh.outputs.sha }}
        run: |
          set -euo pipefail
          python3 deploy/k8s/render.py \
            --pin "$RUNNER_TEMP/web-image-pin/teagram-web-image-pin.json" \
            --source-commit "$DEPLOY_SHA" > "$RUNNER_TEMP/teagram-web-prod.yaml"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Install kubectl for the production k3s version
        env:
          KUBERNETES_VERSION: 1.37.1
        run: bash .github/scripts/install-kubectl.sh

      - name: Install the deploy kubeconfig
        id: kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.K3S_WEB_KUBECONFIG }}
        run: |
          set -euo pipefail
          [[ -n "$KUBECONFIG_CONTENT" ]] || {
            echo '::error::k3s-prod K3S_WEB_KUBECONFIG secret is empty'
            exit 1
          }
          install -d -m 700 "$RUNNER_TEMP/k8s"
          (umask 077 && printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/k8s/config")
          server="$(kubectl --kubeconfig "$RUNNER_TEMP/k8s/config" config view --minify --output 'jsonpath={.clusters[0].cluster.server}')"
          [[ "$server" == 'https://teagram.tailaa4918.ts.net:6443' ]] || {
            echo '::error::the kubeconfig must target the cluster Tailscale API endpoint'
            exit 1
          }
          ca_data="$(kubectl --kubeconfig "$RUNNER_TEMP/k8s/config" config view --minify --output 'jsonpath={.clusters[0].cluster.certificate-authority-data}')"
          [[ -n "$ca_data" ]] || {
            echo '::error::the kubeconfig must pin the cluster CA'
            exit 1
          }
          insecure_skip="$(kubectl --kubeconfig "$RUNNER_TEMP/k8s/config" config view --minify --output 'jsonpath={.clusters[0].cluster.insecure-skip-tls-verify}')"
          # kubectl omits an explicit false value when rendering the kubeconfig.
          if [[ -n "$insecure_skip" ]] || grep -Fq 'insecure-skip-tls-verify' "$RUNNER_TEMP/k8s/config"; then
            echo '::error::the kubeconfig must omit insecure-skip-tls-verify'
            exit 1
          fi
          printf 'KUBECONFIG=%s\n' "$RUNNER_TEMP/k8s/config" >> "$GITHUB_ENV"
          host="${server#https://}"
          printf 'api_host=%s\n' "${host%:6443}" >> "$GITHUB_OUTPUT"

      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.K3S_TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.K3S_TS_OAUTH_SECRET }}
          tags: tag:k3s-deploy
          ping: ${{ steps.kubeconfig.outputs.api_host }}

      - name: Verify deploy kubeconfig identity and permissions
        run: |
          set -euo pipefail

          expected_identity='system:serviceaccount:teagram:teagram-web-deployer'

          if ! actual_identity="$(kubectl auth whoami -o 'jsonpath={.status.userInfo.username}')"; then
            echo '::error::kubectl auth whoami failed; expected system:serviceaccount:teagram:teagram-web-deployer'
            exit 1
          fi
          if [[ "$actual_identity" != "$expected_identity" ]]; then
            printf '::error::kubectl auth whoami returned %q; expected %s\n' "$actual_identity" "$expected_identity"
            exit 1
          fi

          secret_access="$(kubectl auth can-i get secrets -n teagram || true)"
          if [[ "$secret_access" != no ]]; then
            echo '::error::kubectl auth can-i get secrets -n teagram failed; expected no'
            exit 1
          fi

          pod_access="$(kubectl auth can-i create pods -n teagram || true)"
          if [[ "$pod_access" != no ]]; then
            echo '::error::kubectl auth can-i create pods -n teagram failed; expected no'
            exit 1
          fi

      - name: Deploy, verify the selected route, and roll back on failure
        env:
          DEPLOY_SHA: ${{ steps.refresh.outputs.sha }}
          ARTIFACT_DIGEST: ${{ steps.pin.outputs.artifact_digest }}
          DEPLOY_IMAGE: ghcr.io/teagramhq/teagram-web@sha256:${{ steps.refresh.outputs.image_digest }}
          REQUIRE_SINGLE_CLOUDFLARED: 'true'
          WEB_ORIGIN: ${{ needs.check-published-image-pin.outputs.origin }}
        run: |
          set -euo pipefail
          if [[ "$WEB_ORIGIN" == pages ]]; then
            smoke_url='http://127.0.0.1:18080/'
            verify_route=fallback
            verify_label=fallback
          else
            smoke_url='https://web.teagram.io/'
            verify_route=public
            verify_label=rollout
          fi

          VERIFY_ROUTE="$verify_route" VERIFY_LABEL="$verify_label" \
          bash .github/scripts/deploy-k8s-web.sh \
            "$RUNNER_TEMP/teagram-web-prod.yaml" \
            "$DEPLOY_SHA" "$ARTIFACT_DIGEST" "$DEPLOY_IMAGE" "$smoke_url"

      - name: Remove the deploy kubeconfig
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/k8s/config"

  deploy-pages:
    name: 'deploy: web (pages)'
    needs:
      - check-published-image-pin
      - deploy-web
    if: ${{ needs.check-published-image-pin.outputs.skip == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Check out the selected published source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.deploy-web.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the selected web image pin
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.deploy-web.outputs.artifact_name }}
          path: ${{ runner.temp }}/web-image-pin
          run-id: ${{ needs.deploy-web.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the selected source commit and image pin
        id: pin
        env:
          DEPLOY_SHA: ${{ needs.deploy-web.outputs.sha }}
          IMAGE_DIGEST: ${{ needs.deploy-web.outputs.image_digest }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$DEPLOY_SHA" ]] || {
            echo '::error::checked out source does not match the selected published commit'
            exit 1
          }
          pin="$RUNNER_TEMP/web-image-pin/teagram-web-image-pin.json"
          [[ -f "$pin" && ! -L "$pin" ]] || {
            echo '::error::downloaded image pin must be a regular, non-symlink file'
            exit 1
          }
          jq -e --arg sha "$DEPLOY_SHA" \
            --arg image "ghcr.io/teagramhq/teagram-web@sha256:$IMAGE_DIGEST" \
            '.sourceCommit == $sha and .image == $image and (.artifactDigest | test("^sha256:[0-9a-f]{64}$"))' \
            "$pin" >/dev/null || {
              echo '::error::image pin metadata does not match the selected source and digest'
              exit 1
            }
          printf 'artifact_digest=%s\n' "$(jq -r '.artifactDigest' "$pin")" >> "$GITHUB_OUTPUT"

      - name: Verify Pages settings and deployment policy
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_ORIGIN: ${{ needs.check-published-image-pin.outputs.origin }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]] || {
            echo '::error::Pages publishing is allowed only from master'
            exit 1
          }
          [[ "$WEB_ORIGIN" == k3s || "$WEB_ORIGIN" == pages ]] || {
            echo '::error::WEB_ORIGIN must be k3s or pages'
            exit 1
          }

          pages_config="$RUNNER_TEMP/pages-config.json"
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$pages_config"
          jq -e '.build_type == "workflow" and .cname == "web.teagram.io"' \
            "$pages_config" >/dev/null || {
              echo '::error::Pages must use Actions publishing with the configured web.teagram.io custom domain'
              exit 1
            }

          environment="$RUNNER_TEMP/pages-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/github-pages" > "$environment"
          jq -e '
            .deployment_branch_policy.custom_branch_policies == true and
            .deployment_branch_policy.protected_branches == false
          ' "$environment" >/dev/null || {
            echo '::error::the github-pages environment must restrict deployment to the master branch'
            exit 1
          }
          policies="$RUNNER_TEMP/pages-branch-policies.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/github-pages/deployment-branch-policies" > "$policies"
          jq -e '
            (.branch_policies | length) == 1 and
            .branch_policies[0].name == "master" and
            .branch_policies[0].type == "branch"
          ' "$policies" >/dev/null || {
            echo '::error::the github-pages environment must allow only the master branch'
            exit 1
          }

      - name: Pull and extract the pinned image web root
        env:
          DEPLOY_SHA: ${{ needs.deploy-web.outputs.sha }}
          IMAGE_DIGEST: ${{ needs.deploy-web.outputs.image_digest }}
          ARTIFACT_DIGEST: ${{ steps.pin.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/teagramhq/teagram-web@sha256:$IMAGE_DIGEST"
          docker pull --platform linux/amd64 "$image"
          labels="$(docker image inspect "$image" --format '{{ json .Config.Labels }}')"
          jq -e --arg sha "$DEPLOY_SHA" --arg digest "$ARTIFACT_DIGEST" \
            '."org.opencontainers.image.revision" == $sha and ."com.teagram.private-artifact.digest" == $digest' \
            <<<"$labels" >/dev/null || {
              echo '::error::pinned image labels do not match the selected audited source'
              exit 1
            }
          container_id="$(docker create --platform linux/amd64 "$image")"
          trap 'docker rm "$container_id" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/pages-image-html"
          docker cp "$container_id:/usr/share/nginx/html/." "$RUNNER_TEMP/pages-image-html/"

      - name: Verify the pinned web root against the audited artifact
        env:
          DEPLOY_SHA: ${{ needs.deploy-web.outputs.sha }}
          ARTIFACT_DIGEST: ${{ steps.pin.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          verification_log="$RUNNER_TEMP/audited-artifact-verification.log"
          if ! node scripts/verify-deployment-artifact.mjs \
            --dist "$RUNNER_TEMP/pages-image-html" --commit "$DEPLOY_SHA" \
            > "$verification_log" 2>&1; then
            echo '::error::the pinned image web root failed audited artifact verification'
            exit 1
          fi
          actual_digest="$(jq -er '.artifactDigest' "$RUNNER_TEMP/pages-image-html/mtproto-target.json")"
          [[ "$actual_digest" == "$ARTIFACT_DIGEST" ]] || {
            echo '::error::the pinned image web root does not match the image pin artifact digest'
            exit 1
          }
          printf 'audited_image=verified source_commit=%s artifact_digest=%s\n' \
            "$DEPLOY_SHA" "$actual_digest"

      - name: Prepare the Pages site from the pinned image
        env:
          DEPLOY_SHA: ${{ needs.deploy-web.outputs.sha }}
        run: |
          node .github/scripts/prepare-pages-site.mjs prepare \
            --source "$RUNNER_TEMP/pages-image-html" \
            --output "$RUNNER_TEMP/pages-site" \
            --commit "$DEPLOY_SHA"

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Verify hidden resources in the Pages archive
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/pages-well-known-paths.txt"
          archived="$RUNNER_TEMP/pages-archive-paths.txt"
          find "$RUNNER_TEMP/pages-site/.well-known" -type f -printf './.well-known/%P\n' | sort > "$expected"
          tar -tf "$RUNNER_TEMP/artifact.tar" | sort > "$archived"
          missing="$(comm -23 "$expected" "$archived")"
          [[ -z "$missing" ]] || {
            echo '::error::the Pages archive omitted one or more .well-known resources'
            exit 1
          }
          for retired_path in \
            './.well-known/teagram-web/version.txt' \
            './.well-known/telegram-web/version.txt'; do
            if grep --fixed-strings --line-regexp --quiet "$retired_path" "$archived"; then
              echo "::error::the Pages archive contains a retired hidden version resource: $retired_path"
              exit 1
            fi
          done
          grep --fixed-strings --line-regexp --quiet './.well-known/teagram-web/source-commit.txt' "$archived" || {
            echo '::error::the Pages archive omitted the generated source commit marker'
            exit 1
          }
          grep --fixed-strings --line-regexp --quiet './404.html' "$archived" || {
            echo '::error::the Pages archive omitted the application 404 page'
            exit 1
          }
          printf 'pages_archive_well_known=verified files=%s retired_version_paths=omitted\n' \
            "$(wc -l < "$expected" | tr -d ' ')"

      - name: Deploy the Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Verify the selected public origin
        env:
          WEB_ORIGIN: ${{ needs.check-published-image-pin.outputs.origin }}
          DEPLOY_SHA: ${{ needs.deploy-web.outputs.sha }}
        run: |
          node .github/scripts/verify-pages-origin.mjs verify \
            --origin "$WEB_ORIGIN" \
            --commit "$DEPLOY_SHA" \
            --timeout-seconds 600
