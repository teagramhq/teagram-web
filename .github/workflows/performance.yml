name: Web performance at scale

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: web-performance-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  performance:
    name: Load, chat, scroll and search performance
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      PERF_HISTORY_DIRECTORY: .performance-history

    steps:
      - name: Check out web client
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set performance output paths
        run: |
          echo "PERF_FIXTURE_DIRECTORY=$RUNNER_TEMP/teagram-perf-fixture" >> "$GITHUB_ENV"
          echo "PERF_REPORT_PATH=$RUNNER_TEMP/teagram-web-performance.json" >> "$GITHUB_ENV"
          echo "PERF_RECORDER_REPLAY_PATH=$RUNNER_TEMP/teagram-recorder-replay.json" >> "$GITHUB_ENV"
          echo "PERF_SUMMARY_PATH=$RUNNER_TEMP/teagram-web-performance-summary.md" >> "$GITHUB_ENV"
          echo "PERF_SERVER_RPC_TRACE_FILE_100X=$RUNNER_TEMP/teagram-perf-server-rpc-100x.jsonl" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/teagram-perf-server-rpc-100x.jsonl"
          chmod 0600 "$RUNNER_TEMP/teagram-perf-server-rpc-100x.jsonl"

      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm

      # GitHub-hosted Ubuntu images already include browser runtime libraries; avoid apt mirror resolution here.
      - name: Install web dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium

      - name: Test fixture and performance gate helpers
        run: node --test scripts/performance/fixture-release.test.mjs scripts/performance/https-proxy-routing.test.mjs scripts/performance/policy.test.mjs scripts/performance/server-rpc-trace.test.mjs scripts/performance/workflow.test.mjs

      - name: Restore main timing history
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .performance-history
          key: teagram-web-performance-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            teagram-web-performance-${{ runner.os }}-

      - name: Restore same-head A/A evidence
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .performance-aa-evidence
          key: teagram-web-performance-aa-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            teagram-web-performance-aa-${{ github.sha }}-

      - name: Download pinned server fixture release
        id: fixture
        run: node scripts/performance/fixture-release.mjs download --version "$(cat .github/perf-fixture-version)" --output "$PERF_FIXTURE_DIRECTORY"

      - name: Pin performance server runtime
        id: runtime-server
        run: echo "server_commit=$(cat .github/perf-server-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned server runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: teagramhq/teagram-server
          ref: ${{ steps.runtime-server.outputs.server_commit }}
          path: teagram-server
          persist-credentials: false

      - name: Verify the fixture server auth-key encryption key
        run: node --test scripts/performance/server-config.test.mjs

      - name: Set up Go for the fixture server
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: teagram-server/go.mod

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0.3
        with:
          version: v1.2.0

      - name: Read fixture owner credentials
        run: node scripts/performance/read-credentials.mjs teagram-server/test/perf/README.md

      - name: Restore the 1x and 100x fixture databases
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name teagram-perf-postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=perf \
            mirror.gcr.io/library/postgres:18-alpine \
            -c shared_buffers=1GB -c max_connections=200 -c autovacuum=off
          ready=false
          for _ in $(seq 1 60); do
            if docker exec teagram-perf-postgres pg_isready -h 127.0.0.1 -U postgres -q; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs teagram-perf-postgres
            exit 1
          fi
          docker exec teagram-perf-postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'CREATE ROLE browser_acceptance_probe NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS'
          expected_revision="$(jq -r '.migration_revision' "$PERF_FIXTURE_DIRECTORY/manifest.json")"
          for scale in 1x 100x; do
            docker exec teagram-perf-postgres psql -v ON_ERROR_STOP=1 -U postgres -c "CREATE DATABASE teagram_$scale"
            docker cp "$PERF_FIXTURE_DIRECTORY/snapshot/perf_$scale.dump" "teagram-perf-postgres:/tmp/perf_$scale.dump"
            docker exec teagram-perf-postgres pg_restore -U postgres -d "teagram_$scale" -j 4 --no-owner --no-acl "/tmp/perf_$scale.dump"
            docker exec teagram-perf-postgres vacuumdb -U postgres -q --analyze -j 4 -d "teagram_$scale"
            actual_revision="$(docker exec teagram-perf-postgres psql -U postgres -d "teagram_$scale" -qAt -c 'SELECT version FROM atlas_schema_revisions.atlas_schema_revisions ORDER BY version DESC LIMIT 1')"
            if [ "$actual_revision" != "$expected_revision" ]; then
              echo "restored $scale fixture migration revision $actual_revision does not match manifest $expected_revision"
              exit 1
            fi
            blob_dir="$RUNNER_TEMP/teagram-perf-blobs-$scale"
            mkdir -p "$blob_dir"
            if [ -d "$PERF_FIXTURE_DIRECTORY/snapshot/blobs-$scale" ]; then
              cp -a "$PERF_FIXTURE_DIRECTORY/snapshot/blobs-$scale/." "$blob_dir/"
            fi
          done

      - name: Apply pinned runtime server migrations
        shell: bash
        run: |
          set -euo pipefail
          for scale in 1x 100x; do
            atlas migrate apply --url "postgres://postgres:perf@localhost:5432/teagram_$scale?sslmode=disable" --dir file://teagram-server/migrations
          done

      - name: Configure isolated server and browser origins
        shell: bash
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          TG_POSTGRES_DSN_1X=postgres://postgres:perf@localhost:5432/teagram_1x?sslmode=disable
          TG_POSTGRES_DSN_100X=postgres://postgres:perf@localhost:5432/teagram_100x?sslmode=disable
          TG_AUTHKEY_ENC_KEY=2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a
          TG_PUBLIC_LINK_PREFIX=https://links.example.test/
          TG_RSA_KEY_PATH=$RUNNER_TEMP/teagram-perf-server-key.pem
          TG_BLOB_DIR_1X=$RUNNER_TEMP/teagram-perf-blobs-1x
          TG_BLOB_DIR_100X=$RUNNER_TEMP/teagram-perf-blobs-100x
          TG_WEBSOCKET_ALLOWED_ORIGINS=http://localhost:4173,http://localhost:4174,http://localhost:4175,http://localhost:4176,http://localhost:4177,http://localhost:4178,http://localhost:4179
          TG_REGISTRATION=closed
          TG_RATE_LIMIT_SEND_CODE_IP=100
          TG_RATE_LIMIT_SEND_CODE_IP_PHONES=100
          PERF_TLS_KEY=$RUNNER_TEMP/teagram-perf-tls-key.pem
          PERF_TLS_CERT=$RUNNER_TEMP/teagram-perf-tls-cert.pem
          PERF_SERVER_PID_FILE=$RUNNER_TEMP/teagram-perf-server.pid
          PERF_SERVICE_PID_FILE=$RUNNER_TEMP/teagram-perf-services.pid
          EOF
          server_key="$RUNNER_TEMP/teagram-perf-server-key.pem"
          tls_key="$RUNNER_TEMP/teagram-perf-tls-key.pem"
          tls_cert="$RUNNER_TEMP/teagram-perf-tls-cert.pem"
          openssl genrsa -traditional -F4 -out "$server_key" 2048
          chmod 0600 "$server_key"
          openssl pkey -in "$server_key" -pubout -out "$RUNNER_TEMP/teagram-perf-server-public.pem"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_key" -out "$tls_cert" -days 1 \
            -subj '/CN=teagramd.test' \
            -addext 'subjectAltName=DNS:teagramd.test'
          echo "MTPROTO_TARGET_MODE=private" >> "$GITHUB_ENV"
          echo "MTPROTO_PRIVATE_ENDPOINT=wss://teagramd.test/apiws" >> "$GITHUB_ENV"
          echo "MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE=$RUNNER_TEMP/teagram-perf-server-public.pem" >> "$GITHUB_ENV"

      - name: Build fixture server and client bundles in parallel
        id: build
        shell: bash
        env:
          PERF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          client_build_env="$RUNNER_TEMP/teagram-perf-client-build.env"
          client_build_log="$RUNNER_TEMP/teagram-perf-client-build.log"
          bash scripts/performance/build-client-bundles.sh "$client_build_env" > "$client_build_log" 2>&1 &
          client_build_pid=$!

          server_build_status=0
          if go -C teagram-server build -o "$RUNNER_TEMP/teagramd" ./cmd/teagramd; then
            server_build_status=0
          else
            server_build_status=$?
          fi
          if wait "$client_build_pid"; then
            client_build_status=0
          else
            client_build_status=$?
          fi
          cat "$client_build_log"
          if [ "$server_build_status" -ne 0 ] || [ "$client_build_status" -ne 0 ]; then
            exit 1
          fi
          cat "$client_build_env" >> "$GITHUB_ENV"

          : > "$PERF_SERVER_PID_FILE"
          for scale in 1x 100x; do
            if [ "$scale" = 1x ]; then
              dsn="$TG_POSTGRES_DSN_1X"
              blob_dir="$TG_BLOB_DIR_1X"
              listen_port=2443
              websocket_port=2445
            else
              dsn="$TG_POSTGRES_DSN_100X"
              blob_dir="$TG_BLOB_DIR_100X"
              listen_port=2444
              websocket_port=2446
            fi
            rpc_trace_env=()
            if [ "$scale" = "100x" ]; then
              rpc_trace_env+=("TG_RPC_TRACE_FILE=$PERF_SERVER_RPC_TRACE_FILE_100X")
            fi
            nohup env TG_POSTGRES_DSN="$dsn" TG_BLOB_DIR="$blob_dir" \
              TG_RATE_LIMIT_CHANNEL_UNREAD_COUNT=0 \
              TG_LISTEN_ADDR="127.0.0.1:$listen_port" TG_ADVERTISE_ADDR="teagramd.test:$listen_port" \
              TG_WEBSOCKET_LISTEN_ADDR="127.0.0.1:$websocket_port" \
              "${rpc_trace_env[@]}" \
              "$RUNNER_TEMP/teagramd" > "$RUNNER_TEMP/teagram-perf-server-$scale.log" 2>&1 < /dev/null &
            echo "$!" >> "$PERF_SERVER_PID_FILE"
          done
          for port in 2445 2446; do
            ready=0
            for _ in $(seq 1 60); do
              if curl --max-time 2 --silent --show-error "http://127.0.0.1:$port/.well-known/teagramd/client" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat "$RUNNER_TEMP/teagram-perf-server-1x.log" "$RUNNER_TEMP/teagram-perf-server-100x.log"
              exit 1
            fi
          done

      - name: Start local HTTPS and static app servers
        shell: bash
        run: |
          set -euo pipefail
          : > "$PERF_SERVICE_PID_FILE"
          nohup node scripts/performance/serve-dist.mjs "$PERF_BASE_DIST" 4173 > "$RUNNER_TEMP/teagram-perf-base-web.log" 2>&1 < /dev/null &
          echo "$!" >> "$PERF_SERVICE_PID_FILE"
          nohup node scripts/performance/serve-dist.mjs "$PERF_HEAD_DIST" 4174 > "$RUNNER_TEMP/teagram-perf-head-web.log" 2>&1 < /dev/null &
          echo "$!" >> "$PERF_SERVICE_PID_FILE"
          nohup node scripts/performance/serve-dist.mjs "$PERF_BASE_DIST" 4175 > "$RUNNER_TEMP/teagram-perf-base-web-100x.log" 2>&1 < /dev/null &
          echo "$!" >> "$PERF_SERVICE_PID_FILE"
          if [ -n "${PERF_STICKER_BASE_DIST:-}" ]; then
            nohup node scripts/performance/serve-dist.mjs "$PERF_STICKER_BASE_DIST" 4179 > "$RUNNER_TEMP/teagram-perf-sticker-base-web.log" 2>&1 < /dev/null &
            echo "$!" >> "$PERF_SERVICE_PID_FILE"
          fi
          nohup node scripts/performance/serve-dist.mjs "$PERF_HEAD_DIST" 4176 > "$RUNNER_TEMP/teagram-perf-head-web-100x.log" 2>&1 < /dev/null &
          echo "$!" >> "$PERF_SERVICE_PID_FILE"
          nohup node scripts/performance/serve-dist.mjs "$PERF_TRACE_HEAD_DIST" 4177 > "$RUNNER_TEMP/teagram-perf-trace-web-100x.log" 2>&1 < /dev/null &
          echo "$!" >> "$PERF_SERVICE_PID_FILE"
          nohup node scripts/performance/serve-dist.mjs "$PERF_TRACE_BASE_DIST" 4178 > "$RUNNER_TEMP/teagram-perf-trace-base-web-100x.log" 2>&1 < /dev/null &
          echo "$!" >> "$PERF_SERVICE_PID_FILE"
          nohup node scripts/performance/https-proxy.mjs > "$RUNNER_TEMP/teagram-perf-proxy.log" 2>&1 < /dev/null &
          echo "$!" >> "$PERF_SERVICE_PID_FILE"
          ready=0
          for _ in $(seq 1 30); do
          if curl -fsS http://localhost:4174/ >/dev/null && \
            curl -fsS http://localhost:4176/ >/dev/null && \
            curl -fsS http://localhost:4177/ >/dev/null && \
            curl -fsS http://localhost:4178/ >/dev/null && \
            curl -kfsS --resolve teagramd.test:18443:127.0.0.1 \
              -H 'Origin: http://localhost:4174' \
              https://teagramd.test:18443/.well-known/teagramd/client >/dev/null && \
            curl -kfsS --resolve teagramd.test:18443:127.0.0.1 \
              -H 'Origin: http://localhost:4176' \
              https://teagramd.test:18443/.well-known/teagramd/client >/dev/null && \
            curl -kfsS --resolve teagramd.test:18443:127.0.0.1 \
              -H 'Origin: http://localhost:4178' \
              https://teagramd.test:18443/.well-known/teagramd/client >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/teagram-perf-proxy.log"
            exit 1
          fi
          if [ -n "${PERF_STICKER_BASE_ORIGIN:-}" ]; then
            ready=0
            for _ in $(seq 1 30); do
              if curl -fsS http://localhost:4179/ >/dev/null && \
                curl -kfsS --resolve teagramd.test:18443:127.0.0.1 \
                  -H 'Origin: http://localhost:4179' \
                  https://teagramd.test:18443/.well-known/teagramd/client >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat "$RUNNER_TEMP/teagram-perf-proxy.log"
              exit 1
            fi
          fi

      - name: Run worker recorder replay
        id: recorder_replay
        continue-on-error: true
        run: pnpm exec playwright test -c playwright.performance.config.ts e2e/workerMessageReplay.spec.ts --project=performance-chromium --workers=1

      - name: Run scale browser scenarios and 100 ms negative control
        id: browser
        env:
          PERF_FIXTURE_FILE_1X: ${{ runner.temp }}/teagram-perf-fixture/snapshot/fixture-1x.json
          PERF_FIXTURE_FILE_100X: ${{ runner.temp }}/teagram-perf-fixture/snapshot/fixture-100x.json
          PERF_REPORT_PATH: ${{ runner.temp }}/teagram-web-performance.json
          PERF_FIXTURE_VERSION: ${{ steps.fixture.outputs.fixture_version }}
          PERF_SERVER_COMMIT: ${{ steps.runtime-server.outputs.server_commit }}
          PERF_FIXTURE_SERVER_COMMIT: ${{ steps.fixture.outputs.server_commit }}
          PERF_REQUIRE_BASE: ${{ github.event_name == 'pull_request' }}
        run: >-
          pnpm exec playwright test
          -c playwright.performance.config.ts
          e2e/performanceMeasurement.spec.ts
          e2e/performanceScale.spec.ts
          e2e/performancePresentedFrame.spec.ts
          --project=performance-chromium
          --workers=1

      - name: Write performance summary and apply gates
        id: summary
        if: always()
        env:
          PERF_BROWSER_OUTCOME: ${{ steps.browser.outcome || 'not-run' }}
          PERF_RECORDER_REPLAY_OUTCOME: ${{ steps.recorder_replay.outcome || 'not-run' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/performance/write-summary.mjs

      - name: Preserve same-head A/A evidence
        if: always()
        shell: bash
        env:
          PERF_BROWSER_OUTCOME: ${{ steps.browser.outcome || 'not-run' }}
          PERF_SUMMARY_OUTCOME: ${{ steps.summary.outcome || 'not-run' }}
          PERF_BUILD_OUTCOME: ${{ steps.build.outcome || 'not-run' }}
          PERF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          attempt_directory=".performance-aa-evidence/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$attempt_directory"
          copy_evidence() {
            local label="$1"
            local source="$2"
            if [ -f "$source" ]; then cp "$source" "$attempt_directory/$label"; fi
          }
          copy_evidence report.json "$PERF_REPORT_PATH"
          copy_evidence summary.md "$PERF_SUMMARY_PATH"
          copy_evidence recorder-replay.json "$PERF_RECORDER_REPLAY_PATH"
          copy_evidence server-1x.log "$RUNNER_TEMP/teagram-perf-server-1x.log"
          copy_evidence server-100x.log "$RUNNER_TEMP/teagram-perf-server-100x.log"
          copy_evidence server-rpc-100x.jsonl "$PERF_SERVER_RPC_TRACE_FILE_100X"
          if [ -d test-results ]; then cp -a test-results "$attempt_directory/"; fi
          if [ -d playwright-report ]; then cp -a playwright-report "$attempt_directory/"; fi
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg headSha "$GITHUB_SHA" \
            --arg baseSha "$PERF_BASE_SHA" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --arg buildOutcome "$PERF_BUILD_OUTCOME" \
            --arg browserOutcome "$PERF_BROWSER_OUTCOME" \
            --arg summaryOutcome "$PERF_SUMMARY_OUTCOME" \
            '{runId: $runId, attempt: ($attempt | tonumber), headSha: $headSha, baseSha: $baseSha, runUrl: $runUrl, buildOutcome: $buildOutcome, browserOutcome: $browserOutcome, summaryOutcome: $summaryOutcome}' \
            > "$attempt_directory/manifest.json"
          find "$attempt_directory" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > "$attempt_directory/SHA256SUMS"

      - name: Upload browser performance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .performance-aa-evidence/
            ${{ runner.temp }}/teagram-web-performance.json
            ${{ runner.temp }}/teagram-recorder-replay.json
            ${{ runner.temp }}/teagram-perf-server-1x.log
            ${{ runner.temp }}/teagram-perf-server-100x.log
            ${{ runner.temp }}/teagram-perf-server-rpc-100x.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload preserved A/A attempt 1 evidence
        if: always() && hashFiles('.performance-aa-evidence/attempt-1/manifest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-performance-aa-${{ github.run_id }}-attempt-1
          path: .performance-aa-evidence/attempt-1/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload preserved A/A attempt 2 evidence
        if: always() && hashFiles('.performance-aa-evidence/attempt-2/manifest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-performance-aa-${{ github.run_id }}-attempt-2
          path: .performance-aa-evidence/attempt-2/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload preserved A/A attempt 3 evidence
        if: always() && hashFiles('.performance-aa-evidence/attempt-3/manifest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-performance-aa-${{ github.run_id }}-attempt-3
          path: .performance-aa-evidence/attempt-3/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Save same-head A/A evidence
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .performance-aa-evidence
          key: teagram-web-performance-aa-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save updated main timing history
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .performance-history
          key: teagram-web-performance-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stop local services
        if: always()
        shell: bash
        run: |
          if [ -f "$PERF_SERVICE_PID_FILE" ]; then
            while IFS= read -r service_pid; do
              kill "$service_pid" 2>/dev/null || true
            done < "$PERF_SERVICE_PID_FILE"
          fi
          if [ -f "$PERF_SERVER_PID_FILE" ]; then
            while IFS= read -r server_pid; do
              kill "$server_pid" 2>/dev/null || true
            done < "$PERF_SERVER_PID_FILE"
          fi
