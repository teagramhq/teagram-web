name: Pull Request CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Immutable source commit to check out for a caller.
        required: false
        type: string
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  checks:
    name: Build, typecheck, lint and test
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Read and validate the reviewed private target
        id: target
        run: node scripts/private-artifact-release.mjs write-target-outputs

      - name: Test, typecheck and prepare bundle
        run: pnpm test --run && pnpm run typecheck && pnpm run generate-changelog

      - name: Build and audit production bundle
        env:
          MTPROTO_TARGET_MODE: ${{ steps.target.outputs.mode }}
          MTPROTO_PRIVATE_ENDPOINT: ${{ steps.target.outputs.endpoint }}
          MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE: ${{ steps.target.outputs.key_file }}
        run: pnpm exec vite build && pnpm run check-bundle

      - name: Audit default bindings in an isolated source-mapped build
        env:
          CI: 'true'
          MTPROTO_TARGET_MODE: ${{ steps.target.outputs.mode }}
          MTPROTO_PRIVATE_ENDPOINT: ${{ steps.target.outputs.endpoint }}
          MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE: ${{ steps.target.outputs.key_file }}
          MTPROTO_SOURCE_MAP_AUDIT: '1'
        run: |
          audit_dir="$(mktemp -d "$RUNNER_TEMP/teagram-source-map-audit.XXXXXX")"
          trap 'rm -rf "$audit_dir"' EXIT
          pnpm exec vite build --outDir "$audit_dir"
          env -u MTPROTO_TARGET_MODE -u MTPROTO_PRIVATE_ENDPOINT -u MTPROTO_PRIVATE_RSA_PUBLIC_KEY_FILE \
            pnpm run check-bundle -- "$audit_dir"

      - name: Lint
        run: pnpm run lint

      - name: Run private username auth browser smoke
        run: pnpm run test:private-auth

  deployment-workflow:
    name: Deployment workflow contract and actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.2'

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install yq
        run: go install github.com/mikefarah/yq/v4@v4.54.1

      - name: Lint the production deploy workflow
        run: |
          "$(go env GOPATH)/bin/actionlint" .github/workflows/deploy.yml

      - name: Check the deploy workflow contract
        run: PATH="$(go env GOPATH)/bin:$PATH" bash .github/scripts/test-deploy-workflow-contract.sh

      - name: Check deployment script syntax
        run: bash -n deploy/teagram-web/deploy-main.sh && bash -n deploy/telegram-web/deploy-main.sh

      - name: Check rollback artifact modes
        run: bash .github/scripts/test-deploy-backup-rollback.sh
